<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="128" height="128" rx="16" fill="#08090d"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="15.5" stroke="#1c1e2e" stroke-width="1"/>

  <!-- W trace mark -->
  <path
    d="M28 38 L44 90 L64 50 L84 90 L100 38"
    stroke="#e4e6f0"
    stroke-width="5"
    stroke-linecap="square"
