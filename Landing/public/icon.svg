  />

  <!-- Centre node — accent -->
  <rect x="59" y="45" width="10" height="10" fill="#00e5a0"/>

  <!-- Baseline rule -->
  <line x1="28" y1="100" x2="100" y2="100" stroke="#00e5a0" stroke-width="2" opacity="0.35"/>
</svg>
